<body>
    <div class="navbar" id="navbar">
        <div class="container">
            <nav>
                <span>
                    <a href="../index.html">LK</a>
                </span>
                <ul>
                    <li>
                        <a href="../design.html">Design</a>
                    </li>
                    <li>
                        <a href="../web.html">Web</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <main>
        <section class="hero-section">
            <div class="container">
                <div class="hero-content">
                    <div>
                        <h1 class="text--split">Wargaming</h1>
                    </div>
                </div>
            </div>
        </section>

        <section class="media-section">
            <div class="container-full">
                <div class="media-container">
                    <img class="reveal" src="../src/assets/images/design/wargaming/wargaming-header.webp" alt="Wargaming Header Image">
                </div>
            </div>
        </section>

        <section class="work-media-section">
            <div class="container">
                <div class="section-content">
                    <div class="work-list">
                        <div class="work-list__item">
                            <div class="work-list__item__inner left reveal--work">
                                <div>
                                    <video playsinline controls>
                                        <source src="../src/assets/videos/design/wargaming.mp4" type="video/mp4">
                                    </video>
                                </div>
                            </div>
                        </div>
                        <div class="work-list__item">
                            <div class="work-list__item__inner right reveal--work">
                                <div>
                                    <img class="normal" src="../src/assets/images/design/wargaming/wargaming-banner-01.webp" alt="Wargaming Gallery Image 01">
                                </div>
                            </div>
                        </div>
                        <div class="work-list__item">
                            <div class="work-list__item__inner center reveal--work">
                                <div>
                                    <img class="normal" src="../src/assets/images/design/wargaming/wargaming-banner-02.webp" alt="Wargaming Gallery Image 02">
                                </div>
                            </div>
                        </div>
                        <div class="work-list__item">
                            <div class="work-list__item__inner left reveal--work">
                                <div>
                                    <img class="normal" src="../src/assets/images/design/wargaming/wargaming-rollup-banner.webp" alt="Wargaming Gallery Image 03">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="work-more-section">
            <div class="container">            
                <div class="section-content">
                    <span class="reveal overtitle">/More Work</span>
                    <h2 class="text--split">Discover More<br> Design Work</h2>

                    <div class="work-list work-list--split">
                        <div class="work-list__item">
                            <a href="various-clients.html" class="work-list__item__inner split-center reveal--work">
                                <div class="hover--zoom">
                                    <img src="../src/assets/images/various-clients-image.webp" alt="Various Clients Image">
                                </div>
                                <div class="work-list__item__content">
                                    <div class="rollup--animation">
                                        <h3 class="rollup__text">Various Clients</h3>
                                        <span class="h3 rollup__text">View work</span>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="divider"></div>

            <div class="copyrights reveal">

                <span>
                    <button id="btn--scrollUp">Back to top</button>
                </span>
            </div>
